name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只允许一个部署任务排队执行，避免并发写服务器
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Check DEPLOY_HOST secret
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "::error::DEPLOY_HOST secret 缺失或为空（Settings → Secrets and variables → Actions）"
            exit 1
          fi

      - name: Check DEPLOY_USER secret
        run: |
          if [ -z "${{ secrets.DEPLOY_USER }}" ]; then
            echo "::error::DEPLOY_USER secret 缺失或为空（Settings → Secrets and variables → Actions）"
            exit 1
          fi

      - name: Write DEPLOY_SSH_KEY to file
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          if ! head -1 ~/.ssh/id_ed25519 | grep -q "PRIVATE KEY"; then
            echo "::error::DEPLOY_SSH_KEY 为空或不是私钥（第一行应为 -----BEGIN OPENSSH PRIVATE KEY-----）"
            exit 1
          fi

      - name: Trust server host key
        run: |
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync code and dist
        run: |
          rsync -az \
            --exclude .git \
            --exclude .venv \
            --exclude __pycache__ \
            --exclude logs \
            --exclude .env \
            --exclude docker/.env \
            --exclude docker/embedding \
            --exclude frontend/node_modules \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/shopkeeper-agent/"

      - name: Apply and restart
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' <<'REMOTE'
          set -e
          cd ~/shopkeeper-agent
          export PATH="$HOME/.local/bin:$PATH"
          # 服务器到 PyPI 官方源很慢，走腾讯内网镜像
          export UV_DEFAULT_INDEX=http://mirrors.tencentyun.com/pypi/simple
          uv sync --all-groups --frozen
          docker compose -f docker/docker-compose.server.yaml up -d
          sudo systemctl restart shopkeeper
          sleep 5
          curl -sf http://127.0.0.1:8000/docs -o /dev/null
          echo "DEPLOY_OK"
          REMOTE

  # 部署后在服务器上跑冒烟评测子集（每分类各 1 条），准确率低于阈值则整个 workflow 标红
  # 链路类单条失败会在 run_evals 内自动重试一次；job 超时放宽以容纳 LLM 慢速期
  smoke-eval:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 45
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Run smoke evals on server
        run: |
          set -e
          HOST="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          # 评测耗时可达 20+ 分钟，长连接容易被中间设备掐断（远端进程随会话死亡）。
          # 因此评测在服务器端脱钩运行并落盘结果，CI 只用短连接轮询结果文件
          ssh "$HOST" 'rm -f /tmp/smoke_eval.exit /tmp/smoke_eval.log; cd ~/shopkeeper-agent && export PATH="$HOME/.local/bin:$PATH" && setsid bash -c "uv run python evals/run_evals.py --smoke > /tmp/smoke_eval.log 2>&1; echo \$? > /tmp/smoke_eval.exit" > /dev/null 2>&1 < /dev/null &'
          for i in $(seq 1 90); do
            sleep 30
            if ssh "$HOST" 'test -f /tmp/smoke_eval.exit' 2>/dev/null; then
              code=$(ssh "$HOST" 'cat /tmp/smoke_eval.exit')
              ssh "$HOST" 'grep -E "^\[|总体|失败用例|EVAL_" /tmp/smoke_eval.log || tail -20 /tmp/smoke_eval.log'
              echo "smoke eval exit code: $code"
              exit "$code"
            fi
          done
          ssh "$HOST" 'tail -20 /tmp/smoke_eval.log' || true
          echo "smoke eval polling timed out (45min)"
          exit 1
