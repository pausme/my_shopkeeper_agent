name: eval

# 全量导购评测（16 条，含真实 LLM 调用）：手动触发
on:
  workflow_dispatch:

jobs:
  full-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Run full shopping evals on server
        run: |
          set -e
          HOST="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          ssh "$HOST" 'rm -f /tmp/shopping_eval.exit /tmp/shopping_eval.log; cd ~/shopkeeper-agent && export PATH="$HOME/.local/bin:$PATH" && setsid bash -c "API_TOKEN=\$(grep ^API_TOKEN= .env | cut -d= -f2) uv run python evals/run_shopping_evals.py > /tmp/shopping_eval.log 2>&1; echo \$? > /tmp/shopping_eval.exit" > /dev/null 2>&1 < /dev/null &'
          for i in $(seq 1 110); do
            sleep 30
            if ssh "$HOST" 'test -f /tmp/shopping_eval.exit' 2>/dev/null; then
              code=$(ssh "$HOST" 'cat /tmp/shopping_eval.exit')
              ssh "$HOST" 'grep -E "^\[|===|总体|失败用例|EVAL_" /tmp/shopping_eval.log || tail -25 /tmp/shopping_eval.log'
              echo "full eval exit code: $code"
              exit "$code"
            fi
          done
          ssh "$HOST" 'tail -25 /tmp/shopping_eval.log' || true
          echo "full eval polling timed out (55min)"
          exit 1
