# 前端静态托管 + /api 反向代理
# 关键点：/api 是 SSE 流式接口，必须关闭 nginx 缓冲，否则前端收不到逐步进度

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://host.docker.internal:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 传递真实客户端 IP，后端限流按真实 IP 计数
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # SSE 依赖逐块转发，缓冲打开时 nginx 会攒够一块再发，进度条会卡住
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 接口契约文档代理到后端（findings #16）：/docs 与 /openapi.json 此前被
    # try_files 兜底成前端 HTML，联调排障缺少线上契约入口
    location = /openapi.json {
        proxy_pass http://host.docker.internal:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://host.docker.internal:8000/docs;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
