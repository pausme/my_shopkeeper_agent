# 前端静态托管 + /api 反向代理
# 关键点：/api 是 SSE 流式接口，必须关闭 nginx 缓冲，否则前端收不到逐步进度

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://host.docker.internal:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # SSE 依赖逐块转发，缓冲打开时 nginx 会攒够一块再发，进度条会卡住
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
