# 前端静态托管 + /api 反向代理
# 关键点：/api 是 SSE 流式接口，必须关闭 nginx 缓冲，否则前端收不到逐步进度

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # R5：安全响应头（CSP 允许 inline style 供 Tailwind 运行时注入；HSTS 待 HTTPS 上线后启用）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    location /api/ {
        proxy_pass http://host.docker.internal:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 传递真实客户端 IP，后端限流按真实 IP 计数
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # SSE 依赖逐块转发，缓冲打开时 nginx 会攒够一块再发，进度条会卡住
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 接口契约文档代理到后端（findings #16）：/docs 与 /openapi.json 此前被
    # try_files 兜底成前端 HTML，联调排障缺少线上契约入口
    location = /openapi.json {
        proxy_pass http://host.docker.internal:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://host.docker.internal:8000/docs;
        proxy_set_header Host $host;
    }

    # R6：静态资源缺失返回 404，不再被 SPA fallback 兜底成 200 HTML
    location /assets/ {
        try_files $uri =404;
        # R5：hashed 资源长缓存
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 永远走 no-cache，发版即时生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
