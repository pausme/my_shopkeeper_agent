# 4c4g 服务器部署专用编排（方案 A：全本地，含 TEI Embedding）
#
# 与开发版 docker-compose.yaml 的差异：
#   1. 移除 kibana（仅开发调试用，不常驻）
#   2. ES 堆固定 512m，MySQL 调小 buffer pool 并关闭 performance_schema
#   3. 各基础服务只绑定 127.0.0.1，不暴露公网；对外仅 nginx 的 80 端口
#   4. 新增 nginx 托管前端 dist，并把 /api 反代到宿主机 8000 端口的后端
#
# 部署前置条件：
#   - Linux 内核 vm.max_map_count >= 262144（ES 启动依赖）
#   - 建议 2G swap 兜底
#   - bge 模型已下载到 docker/embedding/bge-large-zh-v1.5
#   - 前端已本地执行 pnpm build，产物位于 frontend/dist
#
# 启动：docker compose -f docker/docker-compose.server.yaml up -d

services:
  mysql:
    image: mysql:8.0.32
    container_name: mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?configure in docker/.env}
      MYSQL_USER: ${MYSQL_USER:-didilili}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?configure in docker/.env}
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --innodb-buffer-pool-size=128M
      --performance-schema=OFF
    deploy:
      resources:
        limits:
          memory: 512m

  elasticsearch:
    build: ./elasticsearch
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 1536m

  qdrant:
    image: qdrant/qdrant:v1.16
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 512m

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    platform: linux/amd64
    container_name: embedding
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      MODEL_ID: /models/bge-large-zh-v1.5
      MAX_CONCURRENT_REQUESTS: "16"
      MAX_BATCH_TOKENS: "16384"
    volumes:
      - ./embedding/bge-large-zh-v1.5:/models/bge-large-zh-v1.5
    deploy:
      resources:
        limits:
          memory: 2g

  frontend:
    image: nginx:1.27-alpine
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    # 后端 uvicorn 跑在宿主机 8000 端口，容器内通过 host.docker.internal 访问
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  mysql_data:
  es_data:
  qdrant_data:
