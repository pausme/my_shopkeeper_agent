# 问数链路评测集
#
# 每条用例走完整智能体链路（含真实 LLM 调用），将执行结果与 expect_sql 的
# 结果集对比（默认忽略行序，ordered: true 时要求行序一致；数值统一保留两位小数）。
#
# 字段说明：
#   id / category / question  必填
#   expect_sql                标准答案 SQL（在 dw 库执行）
#   history                   可选，多轮指代追问的前置对话
#   ordered                   可选，结果是否要求按序（默认忽略顺序）
#   smoke                     可选，true 时进入部署后冒烟评测子集（控制在 5 条内）
#
# 注意：教学数仓数据仅覆盖 2025-01-01 ~ 2025-03-31，时间类用例必须落在 Q1 内。

# ========== 一、单表聚合 ==========
- id: q001
  category: 单表聚合
  question: 统计订单总数
  expect_sql: SELECT COUNT(*) AS 订单总数 FROM fact_order
  smoke: true

- id: q002
  category: 单表聚合
  question: 统计所有订单的销售总额
  expect_sql: SELECT SUM(order_amount) AS 销售总额 FROM fact_order

- id: q003
  category: 单表聚合
  question: 所有订单一共卖了多少件商品
  expect_sql: SELECT SUM(order_quantity) AS 总销量 FROM fact_order

- id: q004
  category: 单表聚合
  question: 平均每笔订单的金额是多少
  expect_sql: SELECT AVG(order_amount) AS 平均订单金额 FROM fact_order

- id: q005
  category: 单表聚合
  question: 华北地区一共有多少笔订单
  expect_sql: |
    SELECT COUNT(*) AS 订单数 FROM fact_order f
    JOIN dim_region r ON f.region_id = r.region_id
    WHERE r.region_name = '华北'

- id: q006
  category: 单表聚合
  question: 华东地区的总销售额
  expect_sql: |
    SELECT SUM(order_amount) AS 销售总额 FROM fact_order f
    JOIN dim_region r ON f.region_id = r.region_id
    WHERE r.region_name = '华东'

- id: q007
  category: 单表聚合
  question: 男客户的订单总数
  expect_sql: |
    SELECT COUNT(*) AS 订单数 FROM fact_order f
    JOIN dim_customer c ON f.customer_id = c.customer_id
    WHERE c.gender = '男'

- id: q008
  category: 单表聚合
  question: 黄金会员的订单数量
  expect_sql: |
    SELECT COUNT(*) AS 订单数 FROM fact_order f
    JOIN dim_customer c ON f.customer_id = c.customer_id
    WHERE c.member_level = '黄金'

- id: q009
  category: 单表聚合
  question: 每笔订单平均购买多少件商品
  expect_sql: SELECT AVG(order_quantity) AS 平均购买数量 FROM fact_order

# ========== 二、多表 Join ==========
- id: q010
  category: 多表Join
  question: 统计各大区的订单数和销售额
  expect_sql: |
    SELECT r.region_name AS 大区, COUNT(*) AS 订单数, SUM(f.order_amount) AS 销售额
    FROM fact_order f JOIN dim_region r ON f.region_id = r.region_id
    GROUP BY r.region_name
  smoke: true

- id: q011
  category: 多表Join
  question: 各商品品类的总销售额是多少
  expect_sql: |
    SELECT p.category AS 品类, SUM(f.order_amount) AS 销售额
    FROM fact_order f JOIN dim_product p ON f.product_id = p.product_id
    GROUP BY p.category

- id: q012
  category: 多表Join
  question: 按会员等级统计订单数和销售额
  expect_sql: |
    SELECT c.member_level AS 会员等级, COUNT(*) AS 订单数, SUM(f.order_amount) AS 销售额
    FROM fact_order f JOIN dim_customer c ON f.customer_id = c.customer_id
    GROUP BY c.member_level

- id: q013
  category: 多表Join
