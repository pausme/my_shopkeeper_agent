logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: ${oc.env:DB_HOST,localhost}
  port: ${oc.env:DB_PORT,3306}
  user: ${oc.env:DB_USER,didilili}
  password: ${oc.env:DB_PASSWORD,dili123}
  database: meta

db_dw:
  host: ${oc.env:DB_HOST,localhost}
  port: ${oc.env:DB_PORT,3306}
  user: ${oc.env:DB_USER,didilili}
  password: ${oc.env:DB_PASSWORD,dili123}
  database: dw

qdrant:
  host: localhost
  port: 6333
  embedding_size: 1024

embedding:
  host: localhost
  port: 8081
  model: BAAI/bge-large-zh-v1.5

es:
  host: localhost
  port: 9200
  index_name: data_agent

rerank:
  host: localhost
  port: 8082

shopping:
  # 导购链路检索参数（M5.6 配置化）
  recall_limit: 12      # 语义召回候选数
  recall_threshold: 0.3 # 召回相似度阈值
  rank_top_k: 5         # 排序后保留的商品数
  semantic_floor: 0.4   # 语义地板分：低于该分视为跑题候选

llm:
  model_name: ${oc.env:LLM_MODEL_NAME,Pro/zai-org/GLM-5.1}
  api_key: ${oc.env:LLM_API_KEY}
  base_url: ${oc.env:LLM_BASE_URL,https://api.siliconflow.cn/v1}
